# Servito dal container nginx del web node (vedi Dockerfile).
# La pagina gira in HTTP, non HTTPS: su HTTPS il browser bloccherebbe la chiamata
# al control-plane http:// come mixed content (vedi README).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # no-store: in sviluppo le modifiche devono arrivare subito, senza cache.
        add_header Cache-Control "no-store";
    }
}
