<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HyperSpace AGI — Home</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#0b0c0e;--surface:#131518;--surface2:#191c21;--surface3:#21252d;--border:#272b33;--divider:#1c1f26;--text:#c8cdd6;--text-muted:#636a78;--text-faint:#353a44;--primary:#4f98a3;--primary-h:#2d7d8a;--primary-bg:rgba(79,152,163,.12);--success:#6daa45;--error:#dd6974;--font-mono:'JetBrains Mono',monospace;--font-body:'Inter',sans-serif;--radius:5px;--radius-lg:9px;--tr:160ms cubic-bezier(.16,1,.3,1)}
[data-theme="light"]{--bg:#f0f1f4;--surface:#fff;--surface2:#f6f7fa;--surface3:#eaecf0;--border:#d8dbe2;--text:#191c22;--text-muted:#636a78;--text-faint:#b0b8c8;--primary:#016970;--primary-h:#014f55;--primary-bg:rgba(1,105,112,.08);--success:#3a6e1a;--error:#a12c3a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:50px;position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-weight:700;font-size:.9rem;color:var(--primary);white-space:nowrap}
.hdr-right{margin-left:auto}
#themeBtn{background:none;border:1px solid var(--border);cursor:pointer;padding:5px 7px;border-radius:var(--radius);color:var(--text-muted);line-height:1}
main{padding:18px 20px;max-width:1200px;margin:0 auto}
.sec-title{font-size:.65rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-muted);padding-bottom:8px;border-bottom:1px solid var(--divider);margin-bottom:14px}
.nodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.node-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;transition:border-color var(--tr)}
.node-card:hover{border-color:var(--primary)}
.nc-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.svc-icon{color:var(--primary);flex-shrink:0;display:flex}
.node-id{font-size:.78rem;color:var(--text);flex:1}
.node-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-faint)}
.node-status-dot.active{background:var(--success);box-shadow:0 0 6px var(--success)}
.node-status-dot.unreachable{background:var(--error)}
.node-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.68rem}
.nm-label{color:var(--text-muted)}.nm-val{font-family:var(--font-mono);color:var(--text)}
.btn{display:inline-block;border:1px solid var(--border);cursor:pointer;padding:5px 12px;border-radius:var(--radius);font-size:.72rem;font-weight:500;color:var(--text);text-decoration:none;transition:border-color var(--tr),color var(--tr)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.nodes-empty{padding:40px;text-align:center;color:var(--text-faint);font-size:.8rem;grid-column:1/-1}
#onboardingFrame{width:100%;height:820px;border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:10px;background:var(--surface)}
section{margin-bottom:28px}
</style>
</head>
<body>
<header>
  <div class="logo">⧢ HyperSpace AGI</div>
  <div class="hdr-right"><button id="themeBtn" onclick="toggleTheme()">◐</button></div>
</header>
<main>
  <section>
    <div class="sec-title">Servizi</div>
    <div class="nodes-grid" id="servicesGrid"><div class="nodes-empty">Caricamento…</div></div>
  </section>
  <section>
    <div class="sec-title">Setup / Onboarding</div>
    <iframe id="onboardingFrame" title="Onboarding"></iframe>
  </section>
</main>
<script>
const ICONS = {
  landing_dashboard: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><line x1="12" y1="8.2" x2="6.2" y2="16.2"/><line x1="12" y1="8.2" x2="17.8" y2="16.2"/><line x1="7.2" y1="18" x2="16.8" y2="18"/></svg>',
  onboarding: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><line x1="12" y1="2" x2="12" y2="5.5"/><line x1="12" y1="18.5" x2="12" y2="22"/><line x1="2" y1="12" x2="5.5" y2="12"/><line x1="18.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="19.1" y2="19.1"/><line x1="19.1" y1="4.9" x2="16.7" y2="7.3"/><line x1="7.3" y1="16.7" x2="4.9" y2="19.1"/></svg>',
  control_plane: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="7" rx="1.2"/><rect x="4" y="14" width="16" height="7" rx="1.2"/><circle cx="7.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="7.5" cy="17.5" r="0.8" fill="currentColor" stroke="none"/></svg>',
  open_webui: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="3"/><polyline points="8,16 8,20 12,16"/></svg>',
  obsidian: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="1.5"/><line x1="8" y1="3" x2="8" y2="21"/><line x1="11" y1="8" x2="17" y2="8"/><line x1="11" y1="12" x2="17" y2="12"/></svg>',
  searxng: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>',
  minimesh: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2.2"/><line x1="10" y1="19" x2="14" y2="19"/></svg>'
};

function toggleTheme(){
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function cardHtml(s){
  const dotClass = s.up === true ? 'active' : (s.up === false ? 'unreachable' : '');
  const stateLabel = s.up === true ? 'raggiungibile' : (s.up === false ? 'non raggiungibile' : '—');
  const latency = s.latency_ms != null ? `${s.latency_ms} ms` : '—';
  const url = `${location.protocol}//${location.hostname}:${s.public_port}${s.path}`;
  const icon = ICONS[s.name] || '';
  return `<div class="node-card">
    <div class="nc-header">
      <span class="svc-icon">${icon}</span>
      <span class="node-id">${s.label}</span>
      <span class="node-status-dot ${dotClass}" title="${stateLabel}"></span>
    </div>
    <div class="node-meta">
      <span class="nm-label">Stato</span><span class="nm-val">${stateLabel}</span>
      <span class="nm-label">Latenza</span><span class="nm-val">${latency}</span>
    </div>
    <div style="margin-top:10px"><a class="btn" href="${url}" target="_blank" rel="noopener">Apri →</a></div>
  </div>`;
}

async function refresh(){
  try {
    const r = await fetch('/api/services');
    const d = await r.json();
    document.getElementById('servicesGrid').innerHTML = d.services.map(cardHtml).join('');
  } catch (e) {
    // silenzioso: il prossimo tick riprova, niente da mostrare all'utente per un singolo fetch fallito
  }
}

refresh();
setInterval(refresh, 15000);
document.getElementById('onboardingFrame').src = `${location.protocol}//${location.hostname}:8088/`;
</script>
</body>
</html>
