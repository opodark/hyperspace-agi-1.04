name: test

# La suite c'era (247 test) ma la lanciava solo qualcuno, a mano, quando ci
# pensava. Qui diventa un fatto verificabile a ogni push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le versioni che girano DAVVERO nei container (control-plane/Dockerfile
        # e node/Dockerfile sono 3.11 e 3.12). La macchina di sviluppo e' piu'
        # avanti, quindi questo e' l'unico posto dove un'incompatibilita' con
        # le versioni deployate si vede prima del deploy.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dipendenze
        # Include gli eseguibili dei preset: i test devono provarli davvero.
        # uvicorn, websockets e fastapi servono ai test del gateway immagini, che
        # li importa a livello di modulo: senza, quelle classi saltano (prima
        # facevano fallire l'intera run pytest, che su un errore di raccolta
        # abortisce invece di continuare).
        run: pip install flask flask-cors requests cryptography httpx pytest uvicorn websockets fastapi bandit==1.8.6 ruff==0.14.10
      - name: Suite Python
        # pytest, non unittest: raccoglie sia le classi unittest.TestCase sia le
        # funzioni in stile pytest. Con `unittest discover` restavano invisibili
        # 51 test (quelli con fixture tipo tmp_path, che unittest salta in
        # silenzio), e su un checkout pulito fallivano senza che nessuno lo
        # vedesse. Copre tutto quello che copriva unittest, e copre anche questi.
        run: PYTHONPATH=. python -m pytest tests/ -q
      - name: Sintassi Bash
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n

  web-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintassi
        working-directory: web-node
        run: npm run check
      - name: Check del web node
        working-directory: web-node
        run: npm test
      - name: Dashboard
        run: node --test tests/*.test.cjs
