<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversazioni — diagnostica</title>
<style>
  :root { --bg:#0b0e14; --panel:#131720; --border:#232a36; --text:#d7dde6;
          --muted:#7d8694; --acc:#00f5ff; --ok:#34d399; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:2; background:var(--panel);
           border-bottom:1px solid var(--border); padding:12px 16px;
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  header .dot { width:10px; height:10px; border-radius:50%; background:#22c55e; }
  header .dot.off { background:#ef4444; }
  header .count { color:var(--muted); font-size:13px; margin-left:auto; }
  header a { color:var(--acc); font-size:13px; text-decoration:none; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  .turn { background:var(--panel); border:1px solid var(--border);
          border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .meta { display:flex; gap:8px; align-items:center; font-size:12px;
          color:var(--muted); margin-bottom:8px; flex-wrap:wrap; }
  .badge { padding:2px 8px; border-radius:6px; background:#1b2430; color:var(--acc);
           font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
  .msg { background:#0f141b; border-left:2px solid #2a3340; padding:6px 10px;
         border-radius:6px; margin:6px 0; }
  .msg .author { color:var(--acc); font-size:12px; font-weight:600; }
  .msg .txt { font-size:14px; margin-top:2px; white-space:pre-wrap; word-break:break-word; }
  .reply { margin-top:10px; padding:10px; border-radius:8px; background:#10211f;
           border:1px solid #1d3a36; }
  .reply .lbl { font-size:11px; color:var(--ok); text-transform:uppercase;
                letter-spacing:.5px; margin-bottom:4px; }
  .reply .txt { font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .wait { color:var(--warn); font-size:13px; margin-top:8px; }
  .empty { color:var(--muted); text-align:center; padding:48px 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Conversazioni dei chatbot</h1>
  <span class="count" id="count"></span>
  <a href="/dashboard">dashboard</a>
</header>
<div class="wrap" id="wrap"><div class="empty">Caricamento…</div></div>
<script>
  const wrap = document.getElementById('wrap');
  const dot = document.getElementById('dot');
  const count = document.getElementById('count');
  function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
  async function tick() {
    try {
      const r = await fetch('/conversations/data');
      const d = await r.json();
      const turns = (d.turns || []).slice().reverse();
      dot.className = 'dot';
      count.textContent = turns.length + ' turni';
      if (!turns.length) {
        wrap.innerHTML = '<div class="empty">Nessuna conversazione ancora.</div>';
        return;
      }
      wrap.innerHTML = turns.map(t => `
        <div class="turn">
          <div class="meta">
            <span class="badge">${esc(t.channel)}</span>
            <span>${esc(t.surface)} · ${esc(t.chat)}</span>
            <span style="margin-left:auto">${esc(t.ts)}</span>
          </div>
          ${(t.messages || []).map(m => `
            <div class="msg">
              <div class="author">${esc(m.author)}</div>
              <div class="txt">${esc(m.text)}</div>
            </div>`).join('')}
          ${t.action === 'reply'
            ? `<div class="reply"><div class="lbl">risposta</div><div class="txt">${esc(t.text)}</div></div>`
            : `<div class="wait">azione: ${esc(t.action)}${t.reason ? ' — ' + esc(t.reason) : ''}</div>`}
        </div>`).join('');
    } catch (e) {
      dot.className = 'dot off';
      wrap.innerHTML = '<div class="empty">control-plane non raggiungibile</div>';
    }
  }
  tick();
  setInterval(tick, 4000);
</script>
</body>
</html>
