# Add private mesh access while retaining localhost bindings.
# Use together with docker-compose.windows.yml; set TAILSCALE_BIND_IP in .env.
# All three ports land on hyperspace-gateway (single front door), not on
# core/registry/node-1 directly — see gateway/Caddyfile for why.
services:
  hyperspace-gateway:
    ports:
      - "${TAILSCALE_BIND_IP:?Set TAILSCALE_BIND_IP}:8088:8088"
      - "${TAILSCALE_BIND_IP:?Set TAILSCALE_BIND_IP}:8086:8086"
      - "${TAILSCALE_BIND_IP:?Set TAILSCALE_BIND_IP}:8081:8081"
